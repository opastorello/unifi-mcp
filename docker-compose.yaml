services:
  unifi:
    build: .
    image: ghcr.io/opastorello/unifi-mcp:latest
    container_name: unifi-mcp
    ports:
      - "${PORT:-8012}:8000"
    environment:
      - ENV=${ENV:-production}
      - API_TOKEN=${API_TOKEN:-}
      - CONFIG_PATH=${CONFIG_PATH:-config/config.json}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-60/minute}
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
